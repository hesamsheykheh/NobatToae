<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رزرو نوبت</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
 :root{--bg:#0f1115;--card:#1a1d24;--card2:#22262f;--accent:#7c5cff;--accent2:#5ee6c2;--text:#f2f2f5;--muted:#9397a3;--border:#2a2e38;--danger:#ff5c7a;
   box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
 @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--card:#fff;--card2:#f0f1f4;--text:#1a1d24;--muted:#6b7080;--border:#e4e6eb;}}
 *{box-sizing:border-box}html,body{height:100%;margin:0}
 body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Tahoma,sans-serif;display:flex;justify-content:center}
 .app{width:100%;max-width:430px;min-height:100%;display:flex;flex-direction:column}
 header{padding:14px 16px 10px;position:sticky;top:0;background:var(--bg);padding-top:calc(14px + env(safe-area-inset-top,0px));z-index:5;border-bottom:1px solid var(--border)}
 header h1{font-size:16px;margin:0 0 2px}header p{margin:0;color:var(--muted);font-size:12.5px}
 main{flex:1;padding:14px;overflow-y:auto}
 .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:.15s}
 .card:active{transform:scale(.98)}.card.sel{border-color:var(--accent);background:var(--card2)}
 .row{display:flex;justify-content:space-between;align-items:center}
 .title{font-size:14.5px;font-weight:600}.sub{font-size:12px;color:var(--muted);margin-top:3px}
 .price{color:var(--accent2);font-size:12.5px;font-weight:600;white-space:nowrap}
 .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
 .slot{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 0;text-align:center;font-size:13px;cursor:pointer}
 .slot.sel{background:var(--accent);border-color:var(--accent);color:#fff}
 .srow{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--border)}.srow:last-child{border:none}.srow b{font-weight:600}
 footer{padding:11px 16px calc(13px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);background:var(--bg);position:sticky;bottom:0}
 .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:14.5px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;margin-top:6px}
 .btn:first-child{margin-top:0}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
 .btn.sm{padding:7px 10px;width:auto;font-size:12px;margin:0}
 .empty{color:var(--muted);font-size:13px;text-align:center;padding:36px 10px}
 .success{text-align:center;padding:46px 10px}.success .emoji{font-size:48px;margin-bottom:8px}
 .menu2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
 .menu2 .mcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer}
 .menu2 .mcard .ic{font-size:22px;margin-bottom:6px}.menu2 .mcard .lb{font-size:12px;color:var(--text)}
 .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:9px}
 .stat .v{font-size:19px;font-weight:700}.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
 .iconbtn{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px}
 .link-box{background:var(--card2);border:1px dashed var(--border);border-radius:10px;padding:10px;font-size:12px;word-break:break-all;color:var(--accent2);margin-bottom:8px}
 .qr-box{background:#fff;border-radius:14px;padding:16px;display:flex;justify-content:center;margin-bottom:12px}
 .loading,.err{text-align:center;padding:50px 16px;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="hT">در حال بارگذاری...</h1><p id="hS"></p></header>
  <main id="main"><div class="loading">⏳ در حال اتصال...</div></main>
  <footer id="foot"></footer>
</div>
<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : "";
const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
const params = new URLSearchParams(location.search);
const qsBiz = params.get('biz');
const isAdminMode = params.get('admin') === '1';

const main=document.getElementById('main'), foot=document.getElementById('foot'), hT=document.getElementById('hT'), hS=document.getElementById('hS');

async function api(path, opts={}){
  const res = await fetch(path, {
    ...opts,
    headers: {'Content-Type':'application/json','X-Telegram-Init-Data':initData, ...(opts.headers||{})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(!res.ok){ const e = await res.json().catch(()=>({detail:'خطا'})); throw new Error(e.detail||'خطا'); }
  return res.status===204?null:res.json();
}

function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function card(title,sub,price,onClick,selected){const d=el(`<div class="card${selected?' sel':''}"><div class="row"><div><div class="title">${title}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>${price!=null?`<div class="price">${price.toLocaleString('fa-IR')} تومان</div>`:''}</div></div>`);if(onClick)d.onclick=onClick;return d;}
function btn(text,onClick,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=onClick;return b;}
function back(fn){foot.appendChild(btn('⬅️ بازگشت',fn,'ghost'));}
function askPrice(current){
  const wantsPrice = confirm('آیا می‌خواید برای این خدمت قیمت ثابت مشخص کنید؟\n\n✅ تایید = بله، قیمت می‌دم\n❌ لغو = نه، قیمت در جلسه مشخص می‌شه (مثلاً به‌خاطر نوسان نرخ ارز)');
  if(!wantsPrice) return null;
  const p = prompt('قیمت (تومان):', current!=null?String(current):'');
  if(p===null || p.trim()==='') return null;
  return +p || 0;
}
function showError(msg){main.innerHTML=`<div class="err">⚠️ ${msg}</div>`;foot.innerHTML='';}

// ================= نمای مشتری (یکپارچه: سبد خرید + متخصص اختیاری) =================
let biz=null;
let cart={items:{},step:1,staff:null,staffList:null}; // items: { serviceId: {product, qty} }

async function startCustomer(slug){
  try{ biz = await api('/api/business/by-slug/'+slug); }
  catch(e){ showError('این لینک رزرو معتبر نیست.'); return; }
  cart={items:{},step:1,staff:null,staffList:null};
  renderCart();
}

// آیا این کسب‌وکار تاریخ/ساعت می‌خواد؟ (فروشگاه‌ها نه)
function needsDT(){ return !biz || (biz.needs_datetime!==0 && biz.needs_datetime!==false); }

function cartDuration(){
  return Object.values(cart.items).reduce((s,it)=>s+((it.product.duration_minutes||0)*it.qty),0);
}

// ================= سبد خرید (جریان یکتای رزرو/سفارش برای همه کسب‌وکارها) =================

function cartTotal(){
  return Object.values(cart.items).reduce((s,it)=>s+(it.product.price!=null?it.product.price*it.qty:0),0);
}
function cartHasUnpriced(){
  return Object.values(cart.items).some(it=>it.product.price==null);
}
function cartCount(){
  return Object.values(cart.items).reduce((s,it)=>s+it.qty,0);
}

async function renderCart(){
  const subs={1:'محصولات مورد نظرتون رو انتخاب کنید',2:'بررسی سبد خرید',3:'متخصص مورد نظرتون رو انتخاب کنید',4:'تاریخ تحویل رو انتخاب کنید',5:'ساعت تحویل رو انتخاب کنید',6:'بررسی و تایید نهایی',7:''};
  hT.textContent=biz.name; hS.textContent=subs[cart.step]||'';
  main.innerHTML='';foot.innerHTML='';

  if(cart.step===1){
    main.innerHTML='<div class="loading">⏳</div>';
    const products = await api(`/api/business/${biz.id}/services`);
    main.innerHTML='';
    if(!products.length){main.appendChild(el('<div class="empty">محصولی تعریف نشده</div>'));return;}
    products.forEach(p=>{
      const qty = cart.items[p.id] ? cart.items[p.id].qty : 0;
      const priceTxt = p.price!=null ? p.price.toLocaleString('fa-IR')+' تومان' : '💬 قیمت در لحظه تحویل';
      const row=el(`<div class="card"><div class="row"><div><div class="title">${p.name}</div><div class="sub">${priceTxt}</div></div>
        <div class="row" style="gap:8px"><button class="btn sm">−</button><span style="min-width:18px;text-align:center">${qty}</span><button class="btn sm">+</button></div></div></div>`);
      const btns = row.querySelectorAll('button');
      btns[0].onclick=(e)=>{e.stopPropagation(); if(cart.items[p.id]){cart.items[p.id].qty--; if(cart.items[p.id].qty<=0) delete cart.items[p.id];} renderCart();};
      btns[1].onclick=(e)=>{e.stopPropagation(); if(!cart.items[p.id]) cart.items[p.id]={product:p, qty:0}; cart.items[p.id].qty++; renderCart();};
      main.appendChild(row);
    });
    const count = cartCount();
    foot.appendChild(btn(count? `🛒 ادامه (${count} قلم)` : 'سبد خرید خالیه', ()=>{ if(count){cart.step=2; renderCart();} }, count?'':'ghost'));
    // اگه این کاربر واقعاً ادمین یکی از کسب‌وکارهاست (چک واقعی از دیتابیس، نه فقط ظاهری)، دکمه‌ی ورود به پنل نشون بده
    try{
      const myBizList = await api('/api/my-businesses');
      if(myBizList && myBizList.length){
        const mine = myBizList.find(b=>b.id===biz.id) || myBizList[0];
        foot.appendChild(btn('🔧 ورود به پنل مدیریت «'+mine.name+'»',()=>{ startAdmin(mine.id); },'ghost'));
      } else {
        // کاربر عادی (کسب‌وکار نداره): امکان ساخت کسب‌وکار خودش
        foot.appendChild(btn('➕ کسب‌وکار خودم رو می‌خوام بسازم',()=>showCategoryPicker(()=>renderCart()),'ghost'));
      }
    }catch(e){ /* کاربر مهمون عادیه، مشکلی نیست */ }
  }

  else if(cart.step===2){
    const items=Object.values(cart.items);
    if(!items.length){cart.step=1; return renderCart();}
    items.forEach(it=>{
      const sub = it.product.price!=null ? (it.product.price*it.qty).toLocaleString('fa-IR')+' تومان' : 'قیمت در لحظه تحویل';
      main.appendChild(el(`<div class="card"><div class="row"><span>${it.product.name} × ${it.qty}</span><span class="price">${sub}</span></div></div>`));
    });
    const total = cartTotal();
    main.appendChild(el(`<div class="srow" style="margin-top:8px"><b>جمع کل</b><b>${total.toLocaleString('fa-IR')} تومان${cartHasUnpriced()?' + اقلام بدون قیمت ثابت':''}</b></div>`));
    foot.appendChild(btn('➡️ ادامه',async()=>{
      if(!needsDT()){ cart.staff=null; cart.date=null; cart.time=null; cart.step=6; return renderCart(); }
      if(cart.staffList===null){ cart.staffList = await api(`/api/business/${biz.id}/staff`); }
      cart.step = cart.staffList.length ? 3 : 4;
      renderCart();
    }));
    foot.appendChild(btn('⬅️ افزودن محصول بیشتر',()=>{cart.step=1; renderCart();},'ghost'));
  }

  else if(cart.step===3){
    // مرحله‌ی اختیاری: فقط وقتی نشون داده می‌شه که این کسب‌وکار حداقل یه متخصص ثبت کرده باشه
    (cart.staffList||[]).forEach(s=>main.appendChild(card(s.name,'متخصص',null,()=>{cart.staff=s; cart.step=4; renderCart();})));
    main.appendChild(el('<div class="hdr2" style="margin-top:6px">یا</div>'));
    foot.appendChild(btn('بدون ترجیح خاص، ادامه بده',()=>{cart.staff=null; cart.step=4; renderCart();},'ghost'));
    foot.appendChild(btn('⬅️ بازگشت',()=>{cart.step=2; renderCart();},'ghost'));
  }

  else if(cart.step===4){
    const dates=[]; const today=new Date();
    for(let i=0;i<10;i++){const d=new Date(today); d.setDate(d.getDate()+i); dates.push(d.toISOString().slice(0,10));}
    dates.forEach(d=>main.appendChild(card(d,null,null,()=>{cart.date=d; cart.step=5; renderCart();})));
    foot.appendChild(btn('⬅️ بازگشت',()=>{cart.step=cart.staffList&&cart.staffList.length?3:2; renderCart();},'ghost'));
  }

  else if(cart.step===5){
    main.innerHTML='<div class="loading">⏳</div>';
    const slots = cart.staff
      ? await api(`/api/availability?business_id=${biz.id}&staff_id=${cart.staff.id}&date=${cart.date}&duration=${Math.max(cartDuration(),1)}`)
      : await api(`/api/business/${biz.id}/order-slots?date=${cart.date}`);
    main.innerHTML='';
    if(!slots.length){main.appendChild(el('<div class="empty">این روز ظرفیتی نیست؛ روز دیگه رو امتحان کنید</div>'));foot.appendChild(btn('⬅️ بازگشت',()=>{cart.step=4;renderCart();},'ghost'));return;}
    const w=el('<div class="grid3"></div>');
    slots.forEach(t=>{const s=el(`<div class="slot">${t}</div>`); s.onclick=()=>{cart.time=t; cart.step=6; renderCart();}; w.appendChild(s);});
    main.appendChild(w);
    foot.appendChild(btn('⬅️ بازگشت',()=>{cart.step=4; renderCart();},'ghost'));
  }

  else if(cart.step===6){
    const items=Object.values(cart.items);
    items.forEach(it=>main.appendChild(el(`<div class="srow"><span>${it.product.name} × ${it.qty}</span><span>${it.product.price!=null?(it.product.price*it.qty).toLocaleString('fa-IR')+' ت':'—'}</span></div>`)));
    if(cart.staff) main.appendChild(el(`<div class="srow"><span>👤 متخصص</span><b>${cart.staff.name}</b></div>`));
    if(needsDT()) main.appendChild(el(`<div class="srow"><span>📅 تحویل</span><b>${cart.date} ساعت ${cart.time}</b></div>`));
    const total=cartTotal();
    main.appendChild(el(`<div class="srow"><span>💰 جمع کل</span><b>${total.toLocaleString('fa-IR')} تومان${cartHasUnpriced()?' + موارد متغیر':''}</b></div>`));
    const phoneInput=el('<input type="tel" placeholder="شماره تماس" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;margin-top:10px">');
    main.appendChild(phoneInput);
    foot.appendChild(btn('✅ ثبت نهایی',async()=>{
      if(!phoneInput.value.trim()){alert('شماره تماس رو وارد کنید');return;}
      try{
        const body={business_id:biz.id, items:items.map(it=>({service_id:it.product.id, quantity:it.qty})),
          delivery_date: needsDT()?cart.date:null, delivery_time: needsDT()?cart.time:null,
          phone:phoneInput.value.trim(), name: tgUser?tgUser.first_name:'',
          staff_id: (needsDT() && cart.staff) ? cart.staff.id : null};
        await api('/api/orders',{method:'POST',body});
        cart.step=7; renderCart();
      }catch(e){ alert('❌ '+e.message); }
    }));
    foot.appendChild(btn('⬅️ بازگشت',()=>{cart.step=needsDT()?5:2; renderCart();},'ghost'));
  }

  else if(cart.step===7){
    main.innerHTML=`<div class="success"><div class="emoji">🎉</div><h2>سفارش شما ثبت شد!</h2><p style="color:var(--muted);font-size:13px">${needsDT() ? 'تحویل: '+cart.date+' ساعت '+cart.time : 'فروشنده برای هماهنگی با شما تماس می‌گیره.'}</p></div>`;
    foot.appendChild(btn('بازگشت به منو',()=>{cart={items:{},step:1,staff:null,staffList:null}; renderCart();}));
    if(tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
  }
}

// ================= پنل مدیریت =================
const ADM=[
 {k:'dash',ic:'📊',t:'داشبورد'},{k:'today',ic:'📅',t:'سفارش‌های امروز'},{k:'upcoming',ic:'📋',t:'سفارش‌های آینده'},
 {k:'services',ic:'💼',t:'مدیریت خدمات'},{k:'staff',ic:'👥',t:'مدیریت متخصص‌ها'},
 {k:'schedule',ic:'⏰',t:'برنامه کاری'},{k:'holidays',ic:'🏖',t:'تعطیلات'},{k:'discounts',ic:'🎟',t:'کدهای تخفیف'},
 {k:'reviews',ic:'⭐',t:'نظرات مشتریان'},{k:'revenue',ic:'📈',t:'گزارش درآمد'},{k:'csv',ic:'📄',t:'خروجی CSV'},
 {k:'admins',ic:'👑',t:'مدیریت ادمین‌ها'},{k:'feedback',ic:'💬',t:'بازخورد کاربران'},{k:'link',ic:'🔗',t:'لینک رزرو'},
 {k:'settings',ic:'⚙️',t:'تنظیمات'},
];
// بخش‌هایی که فقط برای کسب‌وکارهای تاریخ/ساعت‌دار معنی دارن
const DT_ONLY = ['upcoming','staff','schedule','holidays'];
let adminInfo = null;
function adminNeedsDT(){ return !adminInfo || adminInfo.needs_datetime!==false; }
function visibleAdm(){
  return ADM.filter(a=>adminNeedsDT() || !DT_ONLY.includes(a.k)).map(a=> (!adminNeedsDT() && a.k==='today') ? {...a,t:'سفارش‌های باز'} : a);
}
let adminBizId=null, aScreen='menu';

async function startAdmin(businessId){
  adminBizId = businessId;
  try{ adminInfo = await api(`/api/admin/${adminBizId}/dashboard`); }
  catch(e){ showError('شما ادمین این کسب‌وکار نیستید.'); return; }
  aScreen='menu'; renderAdmin();
}

async function renderAdmin(){
  hT.textContent='پنل مدیریت'; hS.textContent=aScreen==='menu'?'یک بخش رو انتخاب کنید':(ADM.find(a=>a.k===aScreen)||{}).t||'';
  main.innerHTML='<div class="loading">⏳</div>';foot.innerHTML='';
  if(aScreen==='menu'){
    main.innerHTML='';
    const g=el('<div class="menu2"></div>');
    visibleAdm().forEach(a=>{const c=el(`<div class="mcard"><div class="ic">${a.ic}</div><div class="lb">${a.t}</div></div>`);c.onclick=()=>{aScreen=a.k;renderAdmin();};g.appendChild(c);});
    main.appendChild(g);
    foot.appendChild(btn('🔁 کسب‌وکارهای من / ساخت کسب‌وکار جدید',async()=>{ const me=await api('/api/me'); showMyBusinesses(me.businesses); },'ghost'));
    if(biz){ foot.appendChild(btn('⬅️ بازگشت به صفحه رزرو',()=>{cart={items:{},step:1,staff:null,staffList:null};renderCart();},'ghost')); }
    return;
  }
  back(()=>{aScreen='menu';renderAdmin();});
  try{
    if(aScreen==='dash'){
      const d = await api(`/api/admin/${adminBizId}/dashboard`);
      main.innerHTML='';
      adminInfo = d;
      main.appendChild(el(`<div class="stat"><div class="v">${d.today_count}</div><div class="l">${d.needs_datetime?'سفارش امروز':'سفارش‌های باز'}</div></div>`));
      if(d.needs_datetime) main.appendChild(el(`<div class="stat"><div class="v">${d.upcoming_count}</div><div class="l">سفارش‌های آینده</div></div>`));
      main.appendChild(el(`<div class="stat"><div class="v">${d.month_revenue.toLocaleString('fa-IR')} تومان</div><div class="l">درآمد این ماه (${d.month_count} سفارش)</div></div>`));
      main.appendChild(el(`<div class="stat"><div class="v">⭐ ${d.avg_rating?d.avg_rating.toFixed(1):'-'} / ۵</div><div class="l">${d.review_count} نظر</div></div>`));
    }
    else if(aScreen==='today' || aScreen==='upcoming'){
      const endpoint = aScreen==='today' ? 'today' : 'upcoming';
      const list = await api(`/api/admin/${adminBizId}/orders/${endpoint}`);
      main.innerHTML='';
      if(!list.length){main.appendChild(el(`<div class="empty">${aScreen==='today'?'امروز سفارشی نیست':'سفارش آینده‌ای نیست'}</div>`));return;}
      const statusFa={pending:'⏳ در انتظار',preparing:'👩‍🍳 در حال آماده‌سازی',ready:'✅ آماده تحویل',completed:'📦 تحویل‌شده',cancelled:'❌ لغوشده'};
      list.forEach(o=>{
        const itemsTxt = (o.items||[]).map(i=>`${i.product_name} ×${i.quantity}`).join('، ');
        const staffTxt = o.staff_name ? ' | 👤 '+o.staff_name : '';
        const orderTitle = o.scheduled===0 ? ('سفارش #'+o.id+' · '+String(o.created_at||'').slice(0,16).replace('T',' ')) : (o.delivery_date+' - '+o.delivery_time);
        const c=el(`<div class="card"><div class="row"><div><div class="title">${orderTitle}</div><div class="sub">${itemsTxt}${staffTxt}</div><div class="sub">${o.user_name||''} | ${o.user_phone||''} | ${statusFa[o.status]||o.status}</div></div><button class="iconbtn">⚙️</button></div></div>`);
        c.querySelector('button').onclick=async(e)=>{
          e.stopPropagation();
          const next={pending:'preparing',preparing:'ready',ready:'completed',completed:null,cancelled:null}[o.status];
          const choice = confirm(next ? `وضعیت بعدی: «${statusFa[next]}»؟\n(Cancel = لغو سفارش)` : 'این سفارش رو لغو کنیم؟');
          if(choice && next){ await api(`/api/admin/${adminBizId}/orders/${o.id}/status`,{method:'POST',body:{status:next}}); }
          else if(!choice){ await api(`/api/admin/${adminBizId}/orders/${o.id}/status`,{method:'POST',body:{status:'cancelled'}}); }
          else return;
          renderAdmin();
        };
        main.appendChild(c);
      });
    }
    else if(aScreen==='services'){
      const list = await api(`/api/admin/${adminBizId}/services`);
      main.innerHTML='';
      list.forEach(s=>{
        const sub = (adminNeedsDT()? s.duration_minutes+' دقیقه' : 'محصول')+(s.active?'':' (غیرفعال)')+(s.price==null?' · بدون قیمت ثابت':'');
        main.appendChild(card(s.name,sub,s.price,async()=>{
          const name=prompt('نام خدمت:',s.name); if(name===null)return;
          const dur = adminNeedsDT() ? prompt('مدت (دقیقه):',s.duration_minutes) : s.duration_minutes; if(dur===null)return;
          const price=askPrice(s.price); if(price===undefined)return;
          await api(`/api/admin/services/${s.id}`,{method:'PATCH',body:{name,duration_minutes:+dur,price}}); renderAdmin();
        }));
      });
      foot.appendChild(btn('➕ افزودن خدمت',async()=>{
        const name=prompt('نام خدمت:'); if(!name)return;
        const dur = adminNeedsDT() ? prompt('مدت (دقیقه):','30') : '0';
        const price=askPrice(null); if(price===undefined)return;
        await api(`/api/admin/${adminBizId}/services`,{method:'POST',body:{name,duration_minutes:adminNeedsDT()?(+dur||30):0,price}}); renderAdmin();
      }));
    }
    else if(aScreen==='staff'){
      const list = await api(`/api/admin/${adminBizId}/staff`);
      main.innerHTML='';
      list.forEach(s=>main.appendChild(card(s.name+(s.active?'':' (غیرفعال)'),null,null,async()=>{
        if(confirm(`«${s.name}» غیرفعال/فعال بشه؟`)){await api(`/api/admin/staff/${s.id}`,{method:'DELETE'});renderAdmin();}
      })));
      foot.appendChild(btn('➕ افزودن متخصص',async()=>{const n=prompt('نام متخصص:');if(n){await api(`/api/admin/${adminBizId}/staff`,{method:'POST',body:{name:n}});renderAdmin();}}));
    }
    else if(aScreen==='schedule'){
      const list = await api(`/api/admin/${adminBizId}/schedule`);
      const WD=['دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه','شنبه','یکشنبه'];
      const byDay={}; list.forEach(r=>byDay[r.weekday]=r);
      main.innerHTML='';
      main.appendChild(el('<div class="sub" style="margin-bottom:8px">برای تغییر هر روز روش بزنید</div>'));
      WD.forEach((name,i)=>{
        const r=byDay[i]; const closed = r ? !!r.is_closed : false;
        const sub = closed ? 'تعطیل' : (r ? r.start_time+' تا '+r.end_time : 'پیش‌فرض (۹ تا ۲۰)');
        main.appendChild(card(name,sub,null,async()=>{
          if(!r || closed){
            const start=prompt('ساعت شروع (مثلاً 09:00):','09:00'); if(start===null)return;
            const end=prompt('ساعت پایان (مثلاً 20:00):','20:00'); if(end===null)return;
            await api(`/api/admin/${adminBizId}/schedule`,{method:'POST',body:{weekday:i,start_time:start,end_time:end,is_closed:false}});
          } else {
            await api(`/api/admin/${adminBizId}/schedule`,{method:'POST',body:{weekday:i,is_closed:true}});
          }
          renderAdmin();
        }));
      });
    }
    else if(aScreen==='holidays'){
      const list = await api(`/api/admin/${adminBizId}/holidays`);
      main.innerHTML='';
      list.length? list.forEach(h=>main.appendChild(el(`<div class="card"><div class="row"><span>${h.date} ${h.reason?'- '+h.reason:''}</span><button class="iconbtn" onclick="fetch('/api/admin/holidays/${h.id}',{method:'DELETE',headers:{'X-Telegram-Init-Data':initData}}).then(()=>renderAdmin())">🗑</button></div></div>`))) : main.appendChild(el('<div class="empty">تعطیلی ثبت نشده</div>'));
      foot.appendChild(btn('➕ افزودن تعطیلی',async()=>{const d=prompt('تاریخ (مثلاً 2026-10-20):');if(!d)return;const r=prompt('توضیح (اختیاری):','');await api(`/api/admin/${adminBizId}/holidays`,{method:'POST',body:{date:d,reason:r}});renderAdmin();}));
    }
    else if(aScreen==='discounts'){
      const list = await api(`/api/admin/${adminBizId}/discounts`);
      main.innerHTML='';
      list.forEach(d=>{const v=d.discount_type==='percent'?d.value+'٪':d.value.toLocaleString('fa-IR')+' ت';main.appendChild(el(`<div class="card"><div class="title">${d.code}</div><div class="sub">تخفیف ${v} | استفاده ${d.used_count}/${d.usage_limit||'∞'}</div></div>`));});
      foot.appendChild(btn('➕ ساخت کد تخفیف',async()=>{
        const code=prompt('کد تخفیف:'); if(!code)return;
        const type=confirm('تخفیف درصدیه؟ (Cancel = مبلغ ثابت)')?'percent':'fixed';
        const value=prompt('مقدار تخفیف:'); await api(`/api/admin/${adminBizId}/discounts`,{method:'POST',body:{code,discount_type:type,value:+value||0}}); renderAdmin();
      }));
    }
    else if(aScreen==='reviews'){
      const d = await api(`/api/admin/${adminBizId}/reviews`);
      main.innerHTML='';
      main.appendChild(el(`<div class="stat"><div class="v">⭐ ${d.average?d.average.toFixed(1):'-'} / ۵</div><div class="l">${d.count} نظر</div></div>`));
      d.recent.forEach(r=>main.appendChild(el(`<div class="card"><div class="title">${'⭐'.repeat(r.rating)}</div><div class="sub">${r.comment||''}</div></div>`)));
    }
    else if(aScreen==='revenue'){
      const d = await api(`/api/admin/${adminBizId}/revenue?period=month`);
      main.innerHTML='';
      main.appendChild(el(`<div class="stat"><div class="v">${d.summary.revenue.toLocaleString('fa-IR')} تومان</div><div class="l">درآمد این ماه (${d.summary.cnt} نوبت)</div></div>`));
      d.by_service.forEach(s=>main.appendChild(el(`<div class="srow" style="margin:0 4px"><span>${s.name}</span><b>${s.revenue.toLocaleString('fa-IR')} ت</b></div>`)));
    }
    else if(aScreen==='csv'){
      main.innerHTML='<div class="empty">فایل CSV شامل تمام نوبت‌هاست</div>';
      foot.appendChild(btn('⬇️ دانلود خروجی CSV',()=>{window.open(`/api/admin/${adminBizId}/export-csv?x=${encodeURIComponent(initData)}`,'_blank');}));
    }
    else if(aScreen==='admins'){
      const d = await api(`/api/admin/${adminBizId}/admins`);
      main.innerHTML='';
      d.admins.forEach(a=>main.appendChild(el(`<div class="card"><div class="row"><span>${a.telegram_id===d.owner_id?'👑':'👤'} ${a.telegram_id}</span></div></div>`)));
      foot.appendChild(btn('🎫 ساخت کد دعوت ادمین',async()=>{const r=await api(`/api/admin/${adminBizId}/admins/invite`,{method:'POST'});alert('کد دعوت: '+r.code+'\nاین کد رو به نفر جدید بدید تا با دستور /claimadmin در ربات استفاده کنه.');}));
    }
    else if(aScreen==='link'){
      const d = await api(`/api/admin/${adminBizId}/dashboard`);
      const cfg = await fetch('/api/config').then(x=>x.json()).catch(()=>({bot_username:'YourBot'}));
      const link = 'https://t.me/'+cfg.bot_username+'?start='+d.slug;
      main.innerHTML='';
      main.appendChild(el('<div class="sub" style="margin-bottom:8px">مشتری‌ها می‌تونن با اسکن این کد یا زدن روی لینک، مستقیم وارد رزرو بشن:</div>'));
      const qrBox = el('<div class="qr-box"><div id="qrcanvas"></div></div>');
      main.appendChild(qrBox);
      main.appendChild(el(`<div class="link-box">${link}</div>`));
      // ساخت QR Code (اگه به هر دلیلی اسکریپتش لود نشه، بی‌سروصدا فقط لینک متنی می‌مونه)
      try{ new QRCode(qrBox.querySelector('#qrcanvas'), {text:link, width:160, height:160, colorDark:'#000000', colorLight:'#ffffff'}); }catch(e){ qrBox.remove(); }
      foot.appendChild(btn('📋 کپی لینک',()=>{try{navigator.clipboard.writeText(link);alert('کپی شد ✅');}catch(e){alert(link);}}));
      foot.appendChild(btn('⬇️ دانلود تصویر QR',()=>{
        const img = qrBox.querySelector('img,canvas');
        if(!img){alert('QR ساخته نشد');return;}
        const a=document.createElement('a');
        a.download='qr-'+(d.slug||'link')+'.png';
        a.href = img.tagName==='CANVAS' ? img.toDataURL('image/png') : img.src;
        a.click();
      },'ghost'));
    }
    else if(aScreen==='settings'){
      const d = await api(`/api/admin/${adminBizId}/dashboard`);
      adminInfo = d;
      main.innerHTML='';
      main.appendChild(el(`<div class="stat"><div class="v">${d.business_name}</div><div class="l">${d.category||'بدون صنف'}</div></div>`));
      main.appendChild(card('📅 تاریخ و ساعت تحویل/رزرو', d.needs_datetime ? 'روشن — مشتری تاریخ و ساعت انتخاب می‌کنه (و متخصص، اگه اضافه کرده باشید)' : 'خاموش — مشتری فقط سبد خرید رو ثبت می‌کنه (مناسب فروشگاه)', null, async()=>{
        const next = !d.needs_datetime;
        if(!confirm(next ? 'تاریخ و ساعت روشن بشه؟' : 'تاریخ و ساعت خاموش بشه؟\n(متخصص و برنامه کاری هم دیگه استفاده نمی‌شن)')) return;
        await api(`/api/admin/${adminBizId}/settings`,{method:'POST',body:{needs_datetime:next}});
        if(biz && biz.id===adminBizId) biz.needs_datetime = next ? 1 : 0;
        renderAdmin();
      }));
    }
    else if(aScreen==='feedback'){
      const list = await api(`/api/admin/${adminBizId}/feedback`);
      main.innerHTML='';
      list.length? list.forEach(f=>main.appendChild(el(`<div class="card"><div class="title">${f.user_name||'-'}</div><div class="sub">${f.text}</div></div>`))) : main.appendChild(el('<div class="empty">بازخوردی ثبت نشده</div>'));
    }
  }catch(e){ main.innerHTML=''; main.appendChild(el(`<div class="empty">⚠️ ${e.message}</div>`)); }
}

// ================= ساخت کسب‌وکار: انتخاب صنف (مثل اینستاگرام) =================
// dt = آیا این صنف به‌طور پیش‌فرض تاریخ/ساعت می‌خواد؟ (صاحب کسب‌وکار بعداً از «تنظیمات» می‌تونه عوضش کنه)
const CATEGORIES = [
  {g:'خدمات و نوبت‌دهی',ic:'💇‍♀️',label:'آرایشگاه زنانه',dt:true},{g:'خدمات و نوبت‌دهی',ic:'💈',label:'آرایشگاه مردانه',dt:true},
  {g:'خدمات و نوبت‌دهی',ic:'✨',label:'کلینیک زیبایی و پوست',dt:true},{g:'خدمات و نوبت‌دهی',ic:'💅',label:'ناخن و میکاپ',dt:true},
  {g:'خدمات و نوبت‌دهی',ic:'💆',label:'ماساژ و اسپا',dt:true},{g:'خدمات و نوبت‌دهی',ic:'🦷',label:'دندانپزشکی',dt:true},
  {g:'خدمات و نوبت‌دهی',ic:'🩺',label:'مطب پزشک',dt:true},{g:'خدمات و نوبت‌دهی',ic:'🐾',label:'دامپزشکی',dt:true},
  {g:'خدمات و نوبت‌دهی',ic:'🏋️',label:'باشگاه و مربی شخصی',dt:true},{g:'خدمات و نوبت‌دهی',ic:'📸',label:'آتلیه عکاسی',dt:true},
  {g:'خدمات و نوبت‌دهی',ic:'📚',label:'آموزشگاه و کلاس خصوصی',dt:true},{g:'خدمات و نوبت‌دهی',ic:'⚖️',label:'مشاوره (حقوقی، روان‌شناسی...)',dt:true},
  {g:'خدمات و نوبت‌دهی',ic:'🚗',label:'تعمیرگاه و خدمات خودرو',dt:true},
  {g:'غذا و شیرینی (سفارش با زمان تحویل)',ic:'🎂',label:'کیک و شیرینی‌پزی',dt:true},{g:'غذا و شیرینی (سفارش با زمان تحویل)',ic:'🍔',label:'فست‌فود',dt:true},
  {g:'غذا و شیرینی (سفارش با زمان تحویل)',ic:'☕',label:'کافی‌شاپ',dt:true},{g:'غذا و شیرینی (سفارش با زمان تحویل)',ic:'🍕',label:'رستوران',dt:true},
  {g:'غذا و شیرینی (سفارش با زمان تحویل)',ic:'🥐',label:'نانوایی',dt:true},
  {g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'👕',label:'فروشگاه لباس',dt:false},{g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'👟',label:'فروشگاه کفش و کیف',dt:false},
  {g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'💐',label:'گل‌فروشی',dt:false},{g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'🛒',label:'فروشگاه و خواربار',dt:false},
  {g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'💄',label:'لوازم آرایشی و بهداشتی',dt:false},{g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'📱',label:'موبایل و لوازم دیجیتال',dt:false},
  {g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'📖',label:'کتاب و لوازم‌التحریر',dt:false},{g:'فروشگاه‌ها (بدون تاریخ و ساعت)',ic:'🏪',label:'سایر فروشگاه‌ها',dt:false},
  {g:'سایر',ic:'📦',label:'سایر مشاغل',dt:true},
];

function renderLanding(){
  hT.textContent='نوبت‌دهی و سفارش آنلاین'; hS.textContent='';
  main.innerHTML=''; foot.innerHTML='';
  main.appendChild(el('<div class="empty">برای رزرو، از لینک اختصاصی یک کسب‌وکار وارد بشید.</div>'));
  foot.appendChild(btn('➕ ساخت کسب‌وکار من',showCategoryPicker));
}

function showCategoryPicker(returnFn){
  returnFn = returnFn || goHome;
  hT.textContent='صنف کسب‌وکارتون چیه؟';
  hS.textContent='فروشگاه‌ها تاریخ و ساعت ندارن؛ بقیه دارن. بعداً از «تنظیمات» می‌تونید عوضش کنید';
  main.innerHTML=''; foot.innerHTML='';
  let lastGroup=null;
  CATEGORIES.forEach(c=>{
    if(c.g!==lastGroup){ main.appendChild(el(`<div class="hdr2" style="margin-top:12px;font-weight:600">${c.g}</div>`)); lastGroup=c.g; }
    main.appendChild(card(c.ic+' '+c.label, null, null, async()=>{
      const name=prompt('نام کسب‌وکار:'); if(!name) return;
      try{
        const r = await api('/api/businesses',{method:'POST',body:{name, category:c.label, needs_datetime:c.dt}});
        const cfg = await fetch('/api/config').then(x=>x.json()).catch(()=>({bot_username:'YourBot'}));
        alert('🎉 ساخته شد! لینک رزرو:\nt.me/'+cfg.bot_username+'?start='+r.slug);
        startAdmin(r.business_id);
      }catch(e){ alert('❌ '+e.message); }
    }));
  });
  foot.appendChild(btn('⬅️ انصراف',returnFn,'ghost'));
}

// ================= کسب‌وکارهای من + مسیریابی ورود =================
function showMyBusinesses(list){
  hT.textContent='کسب‌وکارهای من'; hS.textContent='یکی رو برای مدیریت انتخاب کنید';
  main.innerHTML=''; foot.innerHTML='';
  list.forEach(b=>main.appendChild(card((b.category?'':'')+b.name, b.category||null, null, ()=>startAdmin(b.id))));
  foot.appendChild(btn('➕ ساخت کسب‌وکار جدید',()=>showCategoryPicker(()=>showMyBusinesses(list))));
}

// ورود از دکمه‌ی Open (بدون لینک خاص):
// ۱) اگه کسب‌وکار داره → پنل مدیریت  ۲) وگرنه اگه با لینک کسب‌وکاری اومده بود → صفحه‌ی همون کسب‌وکار  ۳) وگرنه صفحه‌ی ساخت کسب‌وکار
async function goHome(){
  try{
    const me = await api('/api/me');
    if(me.businesses.length===1) return startAdmin(me.businesses[0].id);
    if(me.businesses.length>1) return showMyBusinesses(me.businesses);
    if(me.last_business) return startCustomer(me.last_business.slug);
  }catch(e){ /* اگه مشکلی بود، صفحه‌ی ساده‌ی ورود رو نشون بده */ }
  renderLanding();
}

// ================= شروع =================
(async function init(){
  if(!initData){ showError('این صفحه فقط باید از داخل تلگرام (دکمه داخل ربات) باز بشه.'); return; }
  if(isAdminMode && qsBiz){ startAdmin(parseInt(qsBiz)); }
  else if(qsBiz){ startCustomer(qsBiz); }
  else { goHome(); }
})();
</script>
