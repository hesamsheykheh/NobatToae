<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#071A36">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رزرو نوبت</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --navy:#071A36; --blue:#087BFF; --cyan:#12C8FF; --ink:#0560C9;
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#EEF3FA; --line:#E1E8F2;
  --text:#071A36; --muted:#5A6B85; --danger:#D92D4B; --ok:#12A150; --warn:#B7791F;
  --r-md:16px; --r-lg:22px;
  --shadow:0 1px 2px rgba(7,26,54,.04),0 6px 18px rgba(7,26,54,.06);
  --card:var(--surface); --card2:var(--surface2); --border:var(--line); --accent:var(--blue); --accent2:var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);color-scheme:light;overflow-x:hidden;display:flex;justify-content:center;
  font-family:'Vazirmatn','Vazir','IRANSansX','IRANSans','Segoe UI',Tahoma,system-ui,sans-serif;font-size:14px;line-height:1.75}
button,input{font-family:inherit}
.app{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;position:relative}
header{background:linear-gradient(160deg,#071A36 0%,#0A2A5C 68%,#0B3A7E 100%);color:#fff;
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 22px;border-radius:0 0 26px 26px;position:relative;z-index:5}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:34px}
.brand{display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#087BFF,#12C8FF);display:grid;place-items:center;box-shadow:0 4px 12px rgba(18,200,255,.35)}
.logo svg{width:18px;height:18px}
.bname{font-weight:800;font-size:15px}
header h1{font-size:20px;margin:0 0 2px;font-weight:800;line-height:1.55}
header p{margin:0;color:#B9C8E0;font-size:12.5px;min-height:19px}
.hbtn{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer}
.hbtn svg{width:19px;height:19px}
.prog{height:4px;border-radius:4px;background:rgba(255,255,255,.16);margin-top:14px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#087BFF,#12C8FF);border-radius:4px;transition:width .3s}
main{flex:1;padding:18px 16px 24px}
.dock{position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(243,246,251,0),var(--bg) 30%)}
footer{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dock.hasnav footer{padding-bottom:10px}
footer:empty{display:none}
footer .btn{margin-top:8px}footer .btn:first-child{margin-top:0}
nav{display:none;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(7,26,54,.06)}
nav.on{display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;min-height:52px}
nav button svg{width:22px;height:22px}
.ni{width:52px;height:30px;display:grid;place-items:center;border-radius:15px;transition:background .2s}
nav button.on{color:var(--blue)}nav button.on .ni{background:rgba(8,123,255,.12)}
.btn{width:100%;padding:14px;min-height:48px;border:0;border-radius:14px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#087BFF,#0A66DB);box-shadow:0 8px 18px rgba(8,123,255,.26);transition:transform .12s,opacity .2s;margin-top:8px}
.btn:first-child{margin-top:0}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;box-shadow:none}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.sm{width:auto;padding:8px 12px;min-height:36px;font-size:13px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .12s,border-color .2s}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.985)}
.card.sel{border-color:var(--blue);background:#F2F8FF}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.title{font-size:15px;font-weight:700;color:var(--navy)}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.7}
.price{color:var(--navy);font-size:14px;font-weight:800;white-space:nowrap}
.price small{font-size:11px;font-weight:600;color:var(--muted);margin-inline-start:3px}
.go{color:#9AA9C0;display:grid;place-items:center}.go svg{width:18px;height:18px}
.srow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.srow:last-child{border:none}.srow span{color:var(--muted)}.srow b{font-weight:700;color:var(--navy);text-align:left}
.hdr2{font-size:12.5px;color:var(--muted);margin:2px 2px 8px;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.sec h2{margin:0;font-size:15px;font-weight:800;color:var(--navy)}
.sec a{font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:60px}
.li:last-child{border-bottom:0}.li:active{background:var(--surface2)}
.li .tx{flex:1;min-width:0}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0}.ib svg{width:20px;height:20px}
.t-blue{background:#E3F1FF;color:#0560C9}.t-cyan{background:#DDF8FF;color:#0A8FB8}.t-navy{background:#E6EBF5;color:#071A36}
.t-green{background:#DDF6E6;color:#0B7A3B}.t-amber{background:#FFF4DB;color:#8A5A00}.t-rose{background:#FFE5EA;color:#B3213D}
.iconbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:10px;display:grid;place-items:center;min-width:40px;min-height:40px}
.iconbtn svg{width:19px;height:19px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0}
.metric .ib{width:34px;height:34px;border-radius:11px;margin-bottom:10px}.metric .ib svg{width:18px;height:18px}
.metric .v{overflow-wrap:anywhere;font-size:22px;font-weight:800;color:var(--navy);line-height:1.3}
.metric .v small{font-size:11px;font-weight:600;color:var(--muted);margin-inline-start:3px}
.metric .l{font-size:12px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--navy);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);min-height:92px}
.qa button:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.warn{background:#FFF4DB;color:#8A5A00}.chip.info{background:#E3F1FF;color:#0560C9}.chip.ok{background:#DDF6E6;color:#0B7A3B}
.chip.muted{background:#EDF1F7;color:#5A6B85}.chip.danger{background:#FFE5EA;color:#B3213D}
.tm{background:var(--surface2);border-radius:12px;padding:8px 6px;text-align:center;min-width:58px;font-weight:800;color:var(--navy);font-size:13.5px;flex-shrink:0}
.tm small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.act{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.act:last-child{border:0}.act .ib{width:34px;height:34px;border-radius:11px}.act .ib svg{width:17px;height:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 0;text-align:center;font-size:14px;font-weight:700;cursor:pointer;color:var(--navy)}
.slot.sel{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(8,123,255,.3)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.7}
.inp{width:100%;padding:13px 14px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(8,123,255,.12)}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{flex:1;padding:10px 6px;min-height:42px;border-radius:11px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(7,26,54,.1)}
.errline{color:var(--danger);font-size:12.5px;min-height:20px;margin:4px 0 0;font-weight:600}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:20px;font-weight:700;cursor:pointer;line-height:1;padding:0}
.qty button:last-child{background:var(--blue);border-color:var(--blue);color:#fff}
.qty span{min-width:22px;text-align:center;font-weight:800;color:var(--navy)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 14px;line-height:1.9}
.empty .ib{margin:0 auto 10px;width:52px;height:52px;border-radius:18px}.empty .ib svg{width:24px;height:24px}
.err{text-align:center;color:var(--muted);padding:40px 16px;line-height:1.9;white-space:pre-line}
.loading{display:grid;place-items:center;padding:56px 0}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #D6E4F7;border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.success{text-align:center;padding:36px 10px}
.success .ok-ring{width:86px;height:86px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#087BFF,#12C8FF);box-shadow:0 12px 28px rgba(8,123,255,.35)}
.success .ok-ring svg{width:40px;height:40px}
.success h2{margin:0 0 6px;font-size:19px;color:var(--navy)}
.link-box{background:var(--surface2);border:1px dashed #A9C4E8;border-radius:14px;padding:12px;font-size:13px;word-break:break-all;color:var(--ink);margin-bottom:10px;direction:ltr;text-align:left;font-weight:600}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;justify-content:center;margin-bottom:12px;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:60;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(7,26,54,.35)}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(7,26,54,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 6px;font-size:16px;color:var(--navy)}.sheet p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.8;white-space:pre-line}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.stat .v{font-size:22px;font-weight:800;color:var(--navy);line-height:1.4}.stat .l{font-size:12.5px;color:var(--muted)}
.hero{text-align:center;padding:26px 8px 10px}
.hero .ib{width:72px;height:72px;border-radius:24px;margin:0 auto 16px;background:linear-gradient(135deg,#087BFF,#12C8FF);color:#fff;box-shadow:0 14px 30px rgba(8,123,255,.32)}
.hero .ib svg{width:34px;height:34px}
.hero h2{margin:0 0 8px;font-size:19px;color:var(--navy)}.hero p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.9}
.emo{font-size:21px;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr">
    <div class="hrow">
      <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M4 10h16M8.5 3.5v3.5M15.5 3.5v3.5M9 15l2.2 2.2L15.5 13"/></svg></span><span class="bname">نوبیتا</span></div>
      <div id="hAct"></div>
    </div>
    <h1 id="hT">در حال بارگذاری...</h1><p id="hS"></p>
    <div class="prog" id="prog"><i id="progBar"></i></div>
  </header>
  <main id="main"><div class="loading"><span class="spin"></span></div></main>
  <div class="dock" id="dock"><footer id="foot"></footer><nav id="nav"></nav></div>
</div>
<script>
const APP_VERSION = '۴.۰';
const tg = window.Telegram ? window.Telegram.WebApp : null;
if(tg){ tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : "";
const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
const params = new URLSearchParams(location.search);
const qsBiz = params.get('biz');
const isAdminMode = params.get('admin') === '1';

const main=document.getElementById('main'), foot=document.getElementById('foot'), hT=document.getElementById('hT'), hS=document.getElementById('hS');
const nav=document.getElementById('nav'), dock=document.getElementById('dock'), hAct=document.getElementById('hAct'), prog=document.getElementById('prog'), progBar=document.getElementById('progBar');

async function api(path, opts={}){
  const res = await fetch(path, {
    ...opts,
    headers: {'Content-Type':'application/json','X-Telegram-Init-Data':initData, ...(opts.headers||{})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(!res.ok){ const e = await res.json().catch(()=>({detail:'خطا'})); const err = new Error(e.detail||'خطا'); err.status = res.status; throw err; }
  return res.status===204?null:res.json();
}

function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function card(title,sub,price,onClick,selected){
  const d=el(`<div class="card${selected?' sel':''}${onClick?' tap':''}"><div class="row"><div style="min-width:0"><div class="title">${esc(title)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>${price!=null?`<div class="price">${price.toLocaleString('fa-IR')}<small>تومان</small></div>`:''}</div></div>`);
  if(onClick) d.onclick=onClick; return d;
}
function btn(text,onClick,cls=''){const b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=onClick;return b;}
function back(fn){foot.appendChild(btn('بازگشت',fn,'ghost'));}
// ================= ابزارهای رابط: فرم، پنل پایین‌کشو، پیام کوچیک =================
// ================= طراحی نوبیتا: آیکون‌ها و ابزارهای نمایش =================
const ICONS={
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  orders:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
  link:'<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/>',
  bag:'<path d="M5.5 8h13l1 12h-15z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>',
  users:'<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.5.2 4.5 1.8 4.5 4.8"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  tag:'<path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.1 6.1a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8" cy="8" r="1.3"/>',
  star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/>',
  download:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 19.5h15"/>',
  shield:'<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8-7.5 9.5-4.3-1.5-7.5-4.9-7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15 10.5"/>',
  message:'<path d="M20.5 12a8 8 0 0 1-11.7 7.1L4 20.5l1.3-4.3A8 8 0 1 1 20.5 12z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', chev:'<path d="M14.5 6l-6 6 6 6"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  inbox:'<path d="M4 13l2.5-7.5A2 2 0 0 1 8.4 4h7.2a2 2 0 0 1 1.9 1.5L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4.5l1 2h5l1-2H20"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>'
};
function ic(name,size){ return `<svg viewBox="0 0 24 24" width="${size||20}" height="${size||20}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`; }
function money(n){ return n==null ? '—' : Number(n).toLocaleString('fa-IR'); }
// تاریخ میلادی ISO → نمایش شمسی؛ اگه مرورگر پشتیبانی نکنه همون ISO نمایش داده می‌شه
function faDate(iso,withWeekday){
  try{
    const [y,m,d]=String(iso).split('-').map(Number); const dt=new Date(y,m-1,d);
    const o={day:'numeric',month:'long'}; if(withWeekday) o.weekday='long';
    return dt.toLocaleDateString('fa-IR-u-ca-persian',o);
  }catch(e){ return String(iso); }
}
const ORDER_STATUS={pending:['در انتظار','warn'],preparing:['در حال آماده‌سازی','info'],ready:['آماده تحویل','ok'],completed:['تحویل‌شده','muted'],cancelled:['لغوشده','danger']};
function statusChip(st){ const x=ORDER_STATUS[st]||[st,'muted']; return `<span class="chip ${x[1]}">${esc(x[0])}</span>`; }
function clearFoot(){ foot.innerHTML=''; hideNav(); setProgress(null); setHeaderAction(null); }
function hideNav(){ if(nav){ nav.innerHTML=''; nav.className=''; } if(dock) dock.className='dock'; }
function showNav(active, items){
  if(!nav) return;
  nav.innerHTML=''; nav.className='on'; if(dock) dock.className='dock hasnav';
  items.forEach(it=>{
    const b=document.createElement('button'); if(it.k===active) b.className='on';
    b.innerHTML=`<span class="ni">${ic(it.icon,22)}</span><span>${it.label}</span>`;
    b.onclick=it.onClick; nav.appendChild(b);
  });
}
function setProgress(pct){ if(!prog) return; if(pct==null){ prog.style.display='none'; return; } prog.style.display='block'; if(progBar) progBar.style.width=pct+'%'; }
function setHeaderAction(html,fn,label){ if(!hAct) return; hAct.innerHTML=''; if(!html) return; const b=document.createElement('button'); b.className='hbtn'; b.setAttribute('aria-label',label||'منو'); b.innerHTML=html; b.onclick=fn; hAct.appendChild(b); }
function iconCard(icon,tone,title,sub,onClick){
  const d=el(`<div class="card tap"><div class="row"><div style="display:flex;gap:12px;align-items:center;min-width:0"><span class="ib t-${tone}">${ic(icon)}</span><div style="min-width:0"><div class="title">${esc(title)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div></div><span class="go">${ic('chev')}</span></div></div>`);
  d.onclick=onClick; return d;
}
function emptyState(icon,text){ return el(`<div class="empty"><div class="ib t-blue">${ic(icon)}</div>${esc(text)}</div>`); }
try{ if(tg){ tg.setHeaderColor && tg.setHeaderColor('#071A36'); tg.setBackgroundColor && tg.setBackgroundColor('#F3F6FB'); tg.setBottomBarColor && tg.setBottomBarColor('#FFFFFF'); } }catch(e){}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// ارقام فارسی/عربی → انگلیسی (تا کاربر با کیبورد فارسی هم بتونه عدد بنویسه)
function normDigits(str){
  return String(str==null?'':str).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function toast(msg){
  const t=el('<div class="toast"></div>'); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
// پنل پایین‌کشو با چند دکمه؛ مقدار دکمه‌ی انتخاب‌شده رو برمی‌گردونه (یا null اگه بسته شد)
function sheet({title,text,buttons}){
  return new Promise(resolve=>{
    const ov=el('<div class="overlay"></div>'); const sh=el('<div class="sheet"></div>');
    const h=el('<h3></h3>'); h.textContent=title||''; sh.appendChild(h);
    if(text){ const p=el('<p></p>'); p.textContent=text; sh.appendChild(p); }
    const close=(v)=>{ ov.remove(); resolve(v); };
    buttons.forEach(b=>sh.appendChild(btn(b.label,()=>close(b.value),b.cls||'')));
    ov.appendChild(sh); ov.onclick=(e)=>{ if(e.target===ov) close(null); };
    document.body.appendChild(ov);
  });
}
async function askConfirm(title,text,okText,cancelText){
  const v = await sheet({title,text,buttons:[{label:okText||'تایید',value:true},{label:cancelText||'انصراف',value:false,cls:'ghost'}]});
  return v===true;
}
async function safe(fn){ try{ await fn(); }catch(e){ toast('❌ '+e.message); } }

// فرم‌ساز عمومی. fields: {key,type:text|number|tel|date|time|seg|price,label,placeholder,value,hint,required,min,max,options,showIf,labelFn,validate}
function showForm(cfg){
  hT.textContent=cfg.title; hS.textContent=cfg.subtitle||'';
  main.innerHTML=''; clearFoot();
  const nodes=[];
  const currentVals=()=>{ const v={}; nodes.forEach(n=>{ v[n.f.key]=n.get(); }); return v; };
  const refresh=()=>{
    const v=currentVals();
    nodes.forEach(n=>{
      n.wrap.style.display = (!n.f.showIf || n.f.showIf(v)) ? '' : 'none';
      if(n.f.labelFn) n.label.textContent=n.f.labelFn(v);
      if(n.onRefresh) n.onRefresh(v);
    });
  };
  const err=el('<div class="errline"></div>');
  let submit=null;

  cfg.fields.forEach(f=>{
    const wrap=el('<div class="field"></div>');
    const label=el('<label></label>'); label.textContent=f.label; wrap.appendChild(label);
    const node={f,wrap,label,focus:null};
    const mkSeg=(options,getCur,setCur)=>{
      const row=el('<div class="seg"></div>'); const bs=[];
      const paint=()=>bs.forEach(x=>{ x.b.className = x.o.value===getCur() ? 'on' : ''; });
      options.forEach(o=>{ const b=document.createElement('button'); b.textContent=o.label; b.onclick=()=>{ setCur(o.value); paint(); refresh(); }; bs.push({b,o}); row.appendChild(b); });
      paint(); return row;
    };
    if(f.type==='seg'){
      let cur = f.value!==undefined ? f.value : f.options[0].value;
      wrap.appendChild(mkSeg(f.options,()=>cur,v=>{cur=v;}));
      node.get=()=>cur;
    }
    else if(f.type==='price'){
      let mode = (f.value===null) ? 'later' : 'fixed';
      wrap.appendChild(mkSeg([{value:'fixed',label:'قیمت ثابت دارم'},{value:'later',label:'قیمت بعداً مشخص می‌شه'}],()=>mode,v=>{mode=v;}));
      const input=el('<input class="inp" type="text" inputmode="numeric" autocomplete="off" placeholder="مثلاً: 350000" style="margin-top:8px">');
      if(typeof f.value==='number') input.value=String(f.value);
      const live=el('<div class="hint"></div>');
      input.addEventListener('input',()=>{ const n=parseInt(normDigits(input.value).replace(/[^0-9]/g,''),10); live.textContent = isNaN(n)?'':n.toLocaleString('fa-IR')+' تومان'; });
      wrap.appendChild(input); wrap.appendChild(live);
      node.onRefresh=()=>{ input.style.display = mode==='fixed' ? '' : 'none'; live.style.display = mode==='fixed' ? '' : 'none'; };
      node.get=()=>{ if(mode==='later') return null; const raw=normDigits(input.value).replace(/[^0-9]/g,''); return raw===''?NaN:parseInt(raw,10); };
      node.focus=()=>input.focus();
      input.dispatchEvent && input.dispatchEvent(new Event('input'));
    }
    else {
      const t=f.type;
      const input=document.createElement('input'); input.className='inp';
      input.type = (t==='date'||t==='time') ? t : 'text';
      if(t==='number'||t==='tel') input.setAttribute('inputmode', t==='tel'?'tel':'numeric');
      if(f.placeholder) input.placeholder=f.placeholder;
      if(f.max && (t==='text')) input.maxLength=f.max;
      if(t==='date' && f.minToday){ input.min=new Date().toISOString().slice(0,10); }
      if(f.value!==undefined && f.value!==null) input.value=String(f.value);
      input.autocomplete='off';
      input.addEventListener('keydown',e=>{ if(e.key==='Enter' && submit) submit.click(); });
      wrap.appendChild(input);
      node.get=()=>{
        const raw=input.value.trim();
        if(t==='number'||t==='tel'){ const d=normDigits(raw).replace(/[^0-9]/g,''); if(t==='tel') return d; return d===''?null:parseInt(d,10); }
        return raw;
      };
      node.focus=()=>input.focus();
    }
    if(f.hint){ const h=el('<div class="hint"></div>'); h.textContent=f.hint; wrap.appendChild(h); }
    nodes.push(node); main.appendChild(wrap);
  });
  main.appendChild(err);
  refresh();

  const validate=(n,val,all)=>{
    const f=n.f;
    if(f.type==='price'){ if(val!==null && (typeof val!=='number'||isNaN(val))) return 'قیمت رو وارد کنید یا «قیمت بعداً مشخص می‌شه» رو بزنید'; }
    else if(f.type==='number'){
      if(val===null){ if(f.required!==false) return f.label+' رو وارد کنید'; }
      else { if(f.min!==undefined && val<f.min) return f.label+': حداقل '+f.min; if(f.max!==undefined && val>f.max) return f.label+': حداکثر '+f.max; }
    }
    else if(f.type==='tel'){ if(f.required!==false && val.length<(f.minLen||10)) return f.label+' معتبر نیست'; }
    else if(f.type!=='seg'){ if(f.required && !val) return f.label+' رو وارد کنید'; if(f.minLen && val && val.length<f.minLen) return f.label+': حداقل '+f.minLen+' حرف'; }
    if(f.validate){ const e=f.validate(val,all); if(e) return e; }
    return null;
  };
  submit=btn(cfg.submitText||'ذخیره', async()=>{
    const v=currentVals();
    for(const n of nodes){
      if(n.wrap.style.display==='none') continue;
      const e=validate(n,v[n.f.key],v);
      if(e){ err.textContent=e; if(n.focus) n.focus(); return; }
    }
    const old=submit.textContent; submit.disabled=true; submit.textContent='لطفاً صبر کنید...'; err.textContent='';
    try{ await cfg.onSubmit(v); }
    catch(e){ err.textContent='❌ '+e.message; submit.disabled=false; submit.textContent=old; }
  });
  foot.appendChild(submit);
  (cfg.extraButtons||[]).forEach(b=>foot.appendChild(btn(b.label,b.onClick,b.cls||'ghost')));
  foot.appendChild(btn('بازگشت',cfg.onBack,'ghost'));
  setTimeout(()=>{ const first=nodes.find(n=>n.focus && n.wrap.style.display!=='none'); if(first && !cfg.noAutofocus) first.focus(); },150);
}

function showError(msg){ main.innerHTML=`<div class="err">${esc(msg)}</div>`; clearFoot(); }

// ================= نمای مشتری (یکپارچه: سبد خرید + متخصص اختیاری) =================
let biz=null;
let bizCatalog={service:[],product:[]};   // خدمت‌ها و محصولات فروشگاه این کسب‌وکار
let myBizCache=[];                          // کسب‌وکارهای کاربر فعلی (برای دکمه‌ی پنل / ساخت کسب‌وکار)
let cart=newCart();                         // items: { id: {product, qty} }

function newCart(kind){ return {items:{},step:1,staff:null,staffList:null,kind:kind||null,date:null,time:null}; }
// اگه هم خدمت داره هم فروشگاه، اول انتخاب می‌کنه (قدم ۰)؛ وگرنه مستقیم می‌ره سراغ همونی که داره
function resetCart(){
  const hasS=bizCatalog.service.length, hasP=bizCatalog.product.length;
  if(hasS && hasP){ cart=newCart(); cart.step=0; }
  else { cart=newCart(hasP&&!hasS ? 'product' : 'service'); }
}
async function loadCatalog(){
  const all = await api(`/api/business/${biz.id}/services`);
  bizCatalog = { service: all.filter(x=>x.kind!=='product'), product: all.filter(x=>x.kind==='product') };
}

async function startCustomer(slug){
  try{ biz = await api('/api/business/by-slug/'+slug); }
  catch(e){ showError('این لینک رزرو معتبر نیست.'); return; }
  try{ await loadCatalog(); }catch(e){ bizCatalog={service:[],product:[]}; }
  try{ myBizCache = await api('/api/my-businesses'); }catch(e){ myBizCache=[]; }
  resetCart();
  renderCart();
}

// آیا این سفارش تاریخ/ساعت می‌خواد؟ خدمت: همیشه. محصول فروشگاه: فقط اگه صاحب کسب‌وکار روشن کرده باشه
function needsDT(){ return cart.kind==='product' ? !!(biz && (biz.shop_datetime===1||biz.shop_datetime===true)) : true; }

function cartDuration(){
  return Object.values(cart.items).reduce((s,it)=>s+((it.product.duration_minutes||0)*it.qty),0);
}

// ================= سبد خرید (جریان یکتای رزرو/سفارش برای همه کسب‌وکارها) =================

function cartTotal(){
  return Object.values(cart.items).reduce((s,it)=>s+(it.product.price!=null?it.product.price*it.qty:0),0);
}
function cartHasUnpriced(){
  return Object.values(cart.items).some(it=>it.product.price==null);
}
function cartCount(){
  return Object.values(cart.items).reduce((s,it)=>s+it.qty,0);
}

// دکمه‌ی پنل مدیریت (فقط اگه واقعاً ادمین باشه) یا ساخت کسب‌وکار (برای کاربر عادی)
function addCustomerFooterExtras(){
  if(myBizCache && myBizCache.length){
    const mine = myBizCache.find(b=>b.id===biz.id) || myBizCache[0];
    foot.appendChild(btn('ورود به پنل مدیریت «'+mine.name+'»',()=>{ startAdmin(mine.id); },'ghost'));
  } else {
    foot.appendChild(btn('کسب‌وکار خودم رو می‌خوام بسازم',()=>showCategoryPicker(()=>renderCart()),'ghost'));
  }
}

async function renderCart(){
  const isSvc = cart.kind==='service';
  const subs={0:'چی می‌خواید؟',
    1: isSvc?'خدمت مورد نظرتون رو انتخاب کنید':'محصولات مورد نظرتون رو انتخاب کنید',
    2:'بررسی سبد',3:'متخصص مورد نظرتون رو انتخاب کنید',
    4: isSvc?'تاریخ نوبت رو انتخاب کنید':'تاریخ تحویل رو انتخاب کنید',
    5: isSvc?'ساعت نوبت رو انتخاب کنید':'ساعت تحویل رو انتخاب کنید',
    6:'بررسی و تایید نهایی',7:''};
  hT.textContent=biz.name; hS.textContent=subs[cart.step]||'';
  main.innerHTML='';clearFoot();
  setProgress((cart.step>=1 && cart.step<=6) ? Math.round(cart.step/6*100) : null);

  if(cart.step===0){
    main.appendChild(iconCard('calendar','blue','رزرو خدمات', money(bizCatalog.service.length)+' خدمت · انتخاب تاریخ، ساعت و متخصص', ()=>{ cart=newCart('service'); renderCart(); }));
    main.appendChild(iconCard('bag','cyan','فروشگاه', money(bizCatalog.product.length)+' محصول · سفارش با سبد خرید', ()=>{ cart=newCart('product'); renderCart(); }));
    addCustomerFooterExtras();
  }

  else if(cart.step===1){
    const products = bizCatalog[cart.kind] || [];
    if(!products.length){ main.appendChild(el('<div class="empty">'+(isSvc?'هنوز خدمتی':'هنوز محصولی')+' تعریف نشده</div>')); }
    products.forEach(p=>{
      const qty = cart.items[p.id] ? cart.items[p.id].qty : 0;
      const priceTxt = p.price!=null ? p.price.toLocaleString('fa-IR')+' تومان' : (isSvc?'💬 قیمت در جلسه مشخص می‌شود':'💬 قیمت در لحظه تحویل');
      const durTxt = (isSvc && p.duration_minutes) ? ' · '+p.duration_minutes+' دقیقه' : '';
      const row=el(`<div class="card"><div class="row"><div><div class="title">${esc(p.name)}</div><div class="sub">${priceTxt}${durTxt}</div></div>
        <div class="qty"><button aria-label="کم کردن">−</button><span>${qty}</span><button aria-label="اضافه کردن">+</button></div></div></div>`);
      const btns = row.querySelectorAll('button');
      btns[0].onclick=(e)=>{e.stopPropagation(); if(cart.items[p.id]){cart.items[p.id].qty--; if(cart.items[p.id].qty<=0) delete cart.items[p.id];} renderCart();};
      btns[1].onclick=(e)=>{e.stopPropagation(); if(!cart.items[p.id]) cart.items[p.id]={product:p, qty:0}; cart.items[p.id].qty++; renderCart();};
      main.appendChild(row);
    });
    const count = cartCount();
    foot.appendChild(btn(count? `🛒 ادامه (${count} قلم)` : 'سبد خرید خالیه', ()=>{ if(count){cart.step=2; renderCart();} }, count?'':'ghost'));
    if(bizCatalog.service.length && bizCatalog.product.length) foot.appendChild(btn('بازگشت',()=>{ resetCart(); renderCart(); },'ghost'));
    addCustomerFooterExtras();
  }

  else if(cart.step===2){
    const items=Object.values(cart.items);
    if(!items.length){cart.step=1; return renderCart();}
    items.forEach(it=>{
      const sub = it.product.price!=null ? (it.product.price*it.qty).toLocaleString('fa-IR')+' تومان' : 'قیمت در لحظه تحویل';
      main.appendChild(el(`<div class="card"><div class="row"><span>${esc(it.product.name)} × ${it.qty}</span><span class="price">${sub}</span></div></div>`));
    });
    const total = cartTotal();
    main.appendChild(el(`<div class="srow" style="margin-top:8px"><b>جمع کل</b><b>${total.toLocaleString('fa-IR')} تومان${cartHasUnpriced()?' + اقلام بدون قیمت ثابت':''}</b></div>`));
    foot.appendChild(btn('ادامه',async()=>{
      if(!needsDT()){ cart.staff=null; cart.date=null; cart.time=null; cart.step=6; return renderCart(); }
      if(cart.kind==='product'){ cart.staff=null; cart.step=4; return renderCart(); }   // محصول فروشگاه متخصص نداره
      if(cart.staffList===null){ cart.staffList = await api(`/api/business/${biz.id}/staff`); }
      cart.step = cart.staffList.length ? 3 : 4;
      renderCart();
    }));
    foot.appendChild(btn('افزودن بیشتر',()=>{cart.step=1; renderCart();},'ghost'));
  }

  else if(cart.step===3){
    // مرحله‌ی اختیاری: فقط وقتی نشون داده می‌شه که این کسب‌وکار حداقل یه متخصص ثبت کرده باشه
    (cart.staffList||[]).forEach(s=>main.appendChild(card(s.name,'متخصص',null,()=>{cart.staff=s; cart.step=4; renderCart();})));
    main.appendChild(el('<div class="hdr2" style="margin-top:6px">یا</div>'));
    foot.appendChild(btn('بدون ترجیح خاص، ادامه بده',()=>{cart.staff=null; cart.step=4; renderCart();},'ghost'));
    foot.appendChild(btn('بازگشت',()=>{cart.step=2; renderCart();},'ghost'));
  }

  else if(cart.step===4){
    const dates=[]; const today=new Date();
    for(let i=0;i<10;i++){const d=new Date(today); d.setDate(d.getDate()+i); dates.push(d.toISOString().slice(0,10));}
    dates.forEach((d,i)=>main.appendChild(card(faDate(d,true), i===0?'امروز':(i===1?'فردا':null), null, ()=>{cart.date=d; cart.step=5; renderCart();})));
    foot.appendChild(btn('بازگشت',()=>{cart.step=(cart.kind==='service'&&cart.staffList&&cart.staffList.length)?3:2; renderCart();},'ghost'));
  }

  else if(cart.step===5){
    main.innerHTML='<div class="loading"><span class="spin"></span></div>';
    const slots = cart.staff
      ? await api(`/api/availability?business_id=${biz.id}&staff_id=${cart.staff.id}&date=${cart.date}&duration=${Math.max(cartDuration(),1)}`)
      : await api(`/api/business/${biz.id}/order-slots?date=${cart.date}`);
    main.innerHTML='';
    if(!slots.length){main.appendChild(el('<div class="empty">این روز ظرفیتی نیست؛ روز دیگه رو امتحان کنید</div>'));foot.appendChild(btn('بازگشت',()=>{cart.step=4;renderCart();},'ghost'));return;}
    const w=el('<div class="grid3"></div>');
    slots.forEach(t=>{const s=el(`<div class="slot">${t}</div>`); s.onclick=()=>{cart.time=t; cart.step=6; renderCart();}; w.appendChild(s);});
    main.appendChild(w);
    foot.appendChild(btn('بازگشت',()=>{cart.step=4; renderCart();},'ghost'));
  }

  else if(cart.step===6){
    const items=Object.values(cart.items);
    items.forEach(it=>main.appendChild(el(`<div class="srow"><span>${esc(it.product.name)} × ${it.qty}</span><span>${it.product.price!=null?(it.product.price*it.qty).toLocaleString('fa-IR')+' ت':'—'}</span></div>`)));
    if(cart.staff) main.appendChild(el(`<div class="srow"><span>متخصص</span><b>${esc(cart.staff.name)}</b></div>`));
    if(needsDT()) main.appendChild(el(`<div class="srow"><span>${isSvc?'نوبت':'تحویل'}</span><b>${cart.date} ساعت ${cart.time}</b></div>`));
    const total=cartTotal();
    main.appendChild(el(`<div class="srow"><span>جمع کل</span><b>${total.toLocaleString('fa-IR')} تومان${cartHasUnpriced()?' + موارد متغیر':''}</b></div>`));
    main.appendChild(el('<div class="hdr2" style="margin-top:14px">شماره تماس</div>'));
    const phoneInput=el('<input class="inp" type="text" inputmode="tel" autocomplete="tel" placeholder="مثلاً: 09123456789" style="direction:ltr;text-align:right">');
    main.appendChild(phoneInput);
    const phoneErr=el('<div class="errline"></div>'); main.appendChild(phoneErr);
    const submitBtn=btn('ثبت نهایی',async()=>{
      const phone=normDigits(phoneInput.value).replace(/[^0-9+]/g,'');
      if(phone.replace(/\D/g,'').length<10){ phoneErr.textContent='شماره تماس معتبر وارد کنید'; phoneInput.focus(); return; }
      phoneErr.textContent=''; submitBtn.disabled=true; submitBtn.textContent='در حال ثبت...';
      try{
        const body={business_id:biz.id, items:items.map(it=>({service_id:it.product.id, quantity:it.qty})),
          delivery_date: needsDT()?cart.date:null, delivery_time: needsDT()?cart.time:null,
          phone, name: tgUser?tgUser.first_name:'',
          staff_id: (needsDT() && isSvc && cart.staff) ? cart.staff.id : null};
        await api('/api/orders',{method:'POST',body});
        cart.step=7; renderCart();
      }catch(e){ phoneErr.textContent='❌ '+e.message; submitBtn.disabled=false; submitBtn.textContent='✅ ثبت نهایی'; }
    });
    phoneInput.addEventListener('keydown',e=>{ if(e.key==='Enter') submitBtn.click(); });
    foot.appendChild(submitBtn);
    foot.appendChild(btn('بازگشت',()=>{cart.step=needsDT()?5:2; renderCart();},'ghost'));
  }

  else if(cart.step===7){
    main.innerHTML=`<div class="success"><div class="ok-ring">${ic('check',40)}</div><h2>${isSvc?'نوبت شما ثبت شد!':'سفارش شما ثبت شد!'}</h2><p style="color:var(--muted);font-size:13px">${needsDT() ? (isSvc?'نوبت: ':'تحویل: ')+cart.date+' ساعت '+cart.time : 'فروشنده برای هماهنگی با شما تماس می‌گیره.'}</p></div>`;
    foot.appendChild(btn('بازگشت به منو',()=>{ resetCart(); renderCart(); }));
    if(tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
  }
}

      : 'خطای سرور (کد '+(e.status||'?')+'): '+e.message+'\nمطمئن بشید همه‌ی فایل‌های پروژه (به‌خصوص database.py و webapp_api.py) آپدیت شدن.';

async function openOrderSheet(o){
  const nextOf={pending:'preparing',preparing:'ready',ready:'completed',completed:null,cancelled:null};
  const label=(k)=>(ORDER_STATUS[k]||[k])[0];
  const next=nextOf[o.status]; const buttons=[];
  if(next) buttons.push({label:'تغییر وضعیت به «'+label(next)+'»',value:next});
  if(o.status!=='completed' && o.status!=='cancelled') buttons.push({label:'لغو سفارش',value:'cancelled',cls:'danger'});
  buttons.push({label:'بستن',value:null,cls:'ghost'});
  const itemsTxt=(o.items||[]).map(i=>`${i.product_name} ×${i.quantity}`).join('، ');
  const text=[ (o.user_name||'')+(o.user_phone?' · '+o.user_phone:''), itemsTxt, 'وضعیت فعلی: '+label(o.status) ].filter(Boolean).join('\n');
  const choice = await sheet({title:'مدیریت سفارش #'+o.id, text, buttons});
  if(!choice) return;
  if(choice==='cancelled' && !(await askConfirm('لغو سفارش؟','این کار قابل برگشت نیست.','بله، لغو شود','نه'))) return;
  await safe(async()=>{ await api(`/api/admin/${adminBizId}/orders/${o.id}/status`,{method:'POST',body:{status:choice}}); toast('وضعیت به‌روز شد ✅'); renderAdmin(); });
}
function orderCard(o){
  const itemsTxt=(o.items||[]).map(i=>`${i.product_name} ×${i.quantity}`).join('، ');
  const when = o.scheduled!==0
    ? `<div class="tm">${esc(o.delivery_time)}<small>${esc(faDate(o.delivery_date))}</small></div>`
    : `<div class="tm">#${o.id}<small>بدون زمان</small></div>`;
  const staff = o.staff_name ? ' · '+o.staff_name : '';
  const price = o.total_price!=null ? ' · '+money(o.total_price)+' تومان' : '';
  const c=el(`<div class="card tap"><div class="row" style="align-items:flex-start">${when}<div style="flex:1;min-width:0"><div class="title">${esc(o.user_name||'مشتری')}</div><div class="sub">${esc(itemsTxt+staff+price)}</div></div>${statusChip(o.status)}</div></div>`);
  c.onclick=()=>openOrderSheet(o); return c;
}

  try{
    if(aScreen==='home'){ await renderHome(); return; }
    if(aScreen==='menu'){ renderManage(); return; }
    if(aScreen==='today' || aScreen==='upcoming'){ await renderOrdersTab(); return; }
    if(aScreen==='link'){ await renderLinkTab(); return; }
  }catch(e){ showAdminError(e); return; }
  const sec=ADM.find(a=>a.k===aScreen);
  hT.textContent = sec?sec.t:'مدیریت'; hS.textContent = adminInfo?adminInfo.business_name:'';

    if(aScreen==='services' || aScreen==='shop'){

        const d = await api(`/api/admin/${adminBizId}/dashboard`);

                          : 'خاموش — مشتری فقط سبد خرید رو ثبت می‌کنه (مناسب فروشگاه). برای کیک و غذا می‌تونید روشنش کنید',
          null, async()=>{
            const next = !d.shop_datetime;
            if(!(await askConfirm(next ? 'روشن کردن تاریخ و ساعت' : 'خاموش کردن تاریخ و ساعت', next ? 'مشتری موقع سفارش فروشگاه، تاریخ و ساعت تحویل هم انتخاب می‌کنه.' : 'مشتری فقط سبد خرید رو ثبت می‌کنه، بدون تاریخ و ساعت.', 'تایید', 'انصراف'))) return;

  }catch(e){ showAdminError(e); addBack(); }
}

// ================= ساخت کسب‌وکار: انتخاب صنف (مثل اینستاگرام) =================
// صفحه‌ی اصلی فقط صنف‌های «خدمات و نوبت‌دهی» رو نشون می‌ده.
// فروشگاه (محصولات) رو صاحب کسب‌وکار بعداً از داخل پنل مدیریت خودش اضافه می‌کنه.
const CATEGORIES = [
  {g:'خدمات و نوبت‌دهی',ic:'💇‍♀️',label:'آرایشگاه زنانه'},{g:'خدمات و نوبت‌دهی',ic:'💈',label:'آرایشگاه مردانه'},
  {g:'خدمات و نوبت‌دهی',ic:'✨',label:'کلینیک زیبایی و پوست'},{g:'خدمات و نوبت‌دهی',ic:'💅',label:'ناخن و میکاپ'},
  {g:'خدمات و نوبت‌دهی',ic:'💆',label:'ماساژ و اسپا'},{g:'خدمات و نوبت‌دهی',ic:'🦷',label:'دندانپزشکی'},
  {g:'خدمات و نوبت‌دهی',ic:'🩺',label:'مطب پزشک'},{g:'خدمات و نوبت‌دهی',ic:'🐾',label:'دامپزشکی'},
  {g:'خدمات و نوبت‌دهی',ic:'🏋️',label:'باشگاه و مربی شخصی'},{g:'خدمات و نوبت‌دهی',ic:'📸',label:'آتلیه عکاسی'},
  {g:'خدمات و نوبت‌دهی',ic:'📚',label:'آموزشگاه و کلاس خصوصی'},{g:'خدمات و نوبت‌دهی',ic:'⚖️',label:'مشاوره (حقوقی، روان‌شناسی...)'},
  {g:'خدمات و نوبت‌دهی',ic:'🚗',label:'تعمیرگاه و خدمات خودرو'},{g:'خدمات و نوبت‌دهی',ic:'📦',label:'سایر خدمات'},
];

function renderLanding(){
  hT.textContent='نوبت‌دهی و سفارش آنلاین'; hS.textContent='نسخه '+APP_VERSION;
  main.innerHTML=''; clearFoot();
  main.appendChild(el(`<div class="hero"><div class="ib">${ic('calendar')}</div><h2>به نوبیتا خوش اومدید</h2><p>برای رزرو، از لینک اختصاصی یک کسب‌وکار وارد بشید.<br>اگه صاحب کسب‌وکار هستید، همین‌جا کسب‌وکار خودتون رو بسازید.</p></div>`));
  foot.appendChild(btn('ساخت کسب‌وکار من',showCategoryPicker));
}

function showCategoryPicker(returnFn){
  returnFn = returnFn || goHome;
  hT.textContent='صنف کسب‌وکارتون چیه؟';
  hS.textContent='فروشگاه و محصولات رو بعداً از داخل پنل مدیریت اضافه می‌کنید';
  main.innerHTML=''; clearFoot();
  let lastGroup=null;
  CATEGORIES.forEach(c=>{
    if(c.g!==lastGroup){ main.appendChild(el(`<div class="hdr2" style="margin-top:12px;font-weight:600">${c.g}</div>`)); lastGroup=c.g; }
    { const row=el(`<div class="card tap"><div class="row"><div style="display:flex;gap:12px;align-items:center"><span class="ib t-blue emo">${c.ic}</span><div class="title">${esc(c.label)}</div></div><span class="go">${ic('chev')}</span></div></div>`); row.onclick=()=>showBusinessNameForm(c, returnFn); main.appendChild(row); }
  });
  foot.appendChild(btn('انصراف',returnFn,'ghost'));
}

// ================= صفحه‌ی نام کسب‌وکار (بعد از انتخاب صنف) =================
function showBusinessNameForm(c, returnFn){
  hT.textContent='نام کسب‌وکار'; hS.textContent='آخرین قدم؛ یه اسم برای کسب‌وکارتون بنویسید';
  main.innerHTML=''; clearFoot();
  main.appendChild(el(`<div class="card" style="cursor:default"><div class="row"><div><div class="title">${c.ic} ${c.label}</div>
    <div class="sub">بعد از ساخت، از پنل مدیریت خدمات و فروشگاه رو اضافه می‌کنید</div></div>
    <button class="iconbtn" id="chgcat" style="font-size:12px;color:var(--accent)">تغییر</button></div></div>`));
  main.querySelector('#chgcat').onclick=()=>showCategoryPicker(returnFn);
  main.appendChild(el('<div class="hdr2" style="margin-top:14px">نام کسب‌وکار</div>'));
  const input=el('<input type="text" maxlength="60" placeholder="مثلاً: سالن زیبایی نگین" autocomplete="off" style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;outline:none">');
  main.appendChild(input);
  const err=el('<div class="sub" style="color:var(--danger);margin-top:8px;min-height:18px"></div>');
  main.appendChild(err);
  const create = btn('ساخت کسب‌وکار', async()=>{
    const name=input.value.trim();
    if(name.length<2){ err.textContent='اسم کسب‌وکار رو بنویسید (حداقل ۲ حرف)'; input.focus(); return; }
    create.disabled=true; create.textContent='در حال ساخت...'; err.textContent='';
    try{
      const r = await api('/api/businesses',{method:'POST',body:{name, category:c.label}});
      showBusinessCreated(name, r);
    }catch(e){ err.textContent='❌ '+e.message; create.disabled=false; create.textContent='✅ ساخت کسب‌وکار'; }
  });
  input.addEventListener('keydown',e=>{ if(e.key==='Enter') create.click(); });
  foot.appendChild(create);
  foot.appendChild(btn('بازگشت',()=>showCategoryPicker(returnFn),'ghost'));
  setTimeout(()=>input.focus(),150);
}

async function showBusinessCreated(name, r){
  const cfg = await fetch('/api/config').then(x=>x.json()).catch(()=>({bot_username:'YourBot'}));
  const link = 'https://t.me/'+cfg.bot_username+'?start='+r.slug;
  hT.textContent='🎉 کسب‌وکار ساخته شد'; hS.textContent=name;
  main.innerHTML=''; clearFoot();
  main.appendChild(el('<div class="sub" style="margin-bottom:8px">این لینک اختصاصی مشتری‌هاته؛ براشون بفرستید:</div>'));
  main.appendChild(el(`<div class="link-box">${link}</div>`));
  main.appendChild(el('<div class="sub" style="margin-top:10px">قدم بعدی: وارد پنل مدیریت بشید و خدمات‌تون (و اگه خواستید محصولات فروشگاه) رو اضافه کنید.</div>'));
  foot.appendChild(btn('ورود به پنل مدیریت',()=>startAdmin(r.business_id)));
  foot.appendChild(btn('کپی لینک',()=>{ try{ navigator.clipboard.writeText(link); toast('کپی شد ✅'); }catch(e){ toast(link); } },'ghost'));
}

// ================= فرم‌های پنل مدیریت =================
function openCatalogForm(kind,item){
  const isShop = kind==='product', editing = !!item;
  const backFn = ()=>{ aScreen = isShop?'shop':'services'; renderAdmin(); };
  showForm({
    title: (editing?'ویرایش ':'افزودن ')+(isShop?'محصول':'خدمت'),
    subtitle: isShop?'مشخصات محصول فروشگاه':'مشخصات خدمت',
    fields:[
      {key:'name',type:'text',label:isShop?'نام محصول':'نام خدمت',placeholder:isShop?'مثلاً: کیک شکلاتی':'مثلاً: کوتاهی مو',value:item?item.name:'',required:true,max:80},
      ...(isShop?[]:[{key:'duration',type:'number',label:'مدت انجام (دقیقه)',value:item?item.duration_minutes:30,min:5,max:600,hint:'برای محاسبه‌ی ساعت‌های خالی استفاده می‌شه'}]),
      {key:'price',type:'price',label:'قیمت (تومان)',value:item?item.price:undefined,hint:'اگه قیمت ثابت نیست (مثلاً به‌خاطر نوسان نرخ ارز)، «قیمت بعداً مشخص می‌شه» رو بزنید'},
    ],
    submitText: editing?'ذخیره‌ی تغییرات':(isShop?'افزودن محصول':'افزودن خدمت'),
    onSubmit: async(v)=>{
      const body={name:v.name,duration_minutes:isShop?0:v.duration,price:v.price,kind};
      if(editing) await api(`/api/admin/services/${item.id}`,{method:'PATCH',body});
      else await api(`/api/admin/${adminBizId}/services`,{method:'POST',body});
      toast(editing?'ذخیره شد ✅':'اضافه شد ✅'); backFn();
    },
    extraButtons: editing ? [{label:item.active?'غیرفعال کردن (از دید مشتری پنهان می‌شه)':'فعال کردن دوباره',
      onClick:()=>safe(async()=>{ await api(`/api/admin/services/${item.id}`,{method:'DELETE'}); toast(item.active?'غیرفعال شد':'فعال شد ✅'); backFn(); })}] : [],
    onBack: backFn,
  });
}

function openStaffForm(item){
  const editing=!!item; const backFn=()=>{ aScreen='staff'; renderAdmin(); };
  showForm({
    title: editing?'ویرایش متخصص':'افزودن متخصص', subtitle:'مشتری می‌تونه موقع رزرو خدمات، متخصص انتخاب کنه',
    fields:[{key:'name',type:'text',label:'نام متخصص',placeholder:'مثلاً: سارا احمدی',value:item?item.name:'',required:true,max:60}],
    submitText: editing?'ذخیره‌ی تغییرات':'افزودن متخصص',
    onSubmit: async(v)=>{
      if(editing) await api(`/api/admin/staff/${item.id}`,{method:'PATCH',body:{name:v.name}});
      else await api(`/api/admin/${adminBizId}/staff`,{method:'POST',body:{name:v.name}});
      toast(editing?'ذخیره شد ✅':'اضافه شد ✅'); backFn();
    },
    extraButtons: editing ? [{label:item.active?'غیرفعال کردن':'فعال کردن دوباره',
      onClick:()=>safe(async()=>{ await api(`/api/admin/staff/${item.id}`,{method:'DELETE'}); toast(item.active?'غیرفعال شد':'فعال شد ✅'); backFn(); })}] : [],
    onBack: backFn,
  });
}

function openHolidayForm(){
  const backFn=()=>{ aScreen='holidays'; renderAdmin(); };
  showForm({
    title:'افزودن تعطیلی', subtitle:'در این روز مشتری نمی‌تونه نوبت بگیره',
    fields:[
      {key:'date',type:'date',label:'تاریخ',required:true,minToday:true},
      {key:'reason',type:'text',label:'توضیح (اختیاری)',placeholder:'مثلاً: تعطیلات رسمی',max:60,required:false},
    ],
    submitText:'ثبت تعطیلی',
    onSubmit: async(v)=>{ await api(`/api/admin/${adminBizId}/holidays`,{method:'POST',body:{date:v.date,reason:v.reason||''}}); toast('ثبت شد ✅'); backFn(); },
    onBack: backFn,
  });
}

function openDiscountForm(){
  const backFn=()=>{ aScreen='discounts'; renderAdmin(); };
  showForm({
    title:'ساخت کد تخفیف', subtitle:'مشتری موقع ثبت سفارش، این کد رو وارد می‌کنه',
    fields:[
      {key:'code',type:'text',label:'کد تخفیف',placeholder:'مثلاً: SUMMER20',required:true,max:20,
        validate:(v)=>/^[A-Za-z0-9_-]{3,20}$/.test(v)?null:'کد باید ۳ تا ۲۰ حرف انگلیسی یا عدد باشه (بدون فاصله)'},
      {key:'type',type:'seg',label:'نوع تخفیف',options:[{value:'percent',label:'٪ درصدی'},{value:'fixed',label:'مبلغ ثابت'}],value:'percent'},
      {key:'value',type:'number',label:'درصد تخفیف (۱ تا ۹۹)',labelFn:(v)=>v.type==='percent'?'درصد تخفیف (۱ تا ۹۹)':'مبلغ تخفیف (تومان)',min:1,
        validate:(val,all)=> (all.type==='percent' && val>99) ? 'درصد تخفیف حداکثر ۹۹ می‌تونه باشه' : null},
      {key:'expiry',type:'date',label:'تاریخ انقضا (اختیاری)',required:false,minToday:true},
      {key:'limit',type:'number',label:'حداکثر تعداد استفاده (اختیاری)',required:false,min:1,hint:'خالی بذارید یعنی نامحدود'},
    ],
    submitText:'ساخت کد تخفیف',
    onSubmit: async(v)=>{
      await api(`/api/admin/${adminBizId}/discounts`,{method:'POST',body:{code:v.code.toUpperCase(),discount_type:v.type,value:v.value,expiry_date:v.expiry||null,usage_limit:v.limit}});
      toast('کد تخفیف ساخته شد ✅'); backFn();
    },
    onBack: backFn,
  });
}

function openScheduleForm(dayIdx,dayName,row){
  const backFn=()=>{ aScreen='schedule'; renderAdmin(); };
  const closed = row ? !!row.is_closed : false;
  showForm({
    title:'برنامه کاری '+dayName, subtitle:'ساعت کاری این روز هفته',
    fields:[
      {key:'state',type:'seg',label:'وضعیت',options:[{value:'open',label:'باز است'},{value:'closed',label:'تعطیل است'}],value:closed?'closed':'open'},
      {key:'start',type:'time',label:'ساعت شروع',value:(row&&row.start_time)||'09:00',showIf:(v)=>v.state==='open',required:true},
      {key:'end',type:'time',label:'ساعت پایان',value:(row&&row.end_time)||'20:00',showIf:(v)=>v.state==='open',required:true,
        validate:(val,all)=> all.state==='open' && all.start && val<=all.start ? 'ساعت پایان باید بعد از ساعت شروع باشه' : null},
    ],
    submitText:'ذخیره',
    onSubmit: async(v)=>{
      const body = v.state==='closed' ? {weekday:dayIdx,is_closed:true} : {weekday:dayIdx,start_time:v.start,end_time:v.end,is_closed:false};
      await api(`/api/admin/${adminBizId}/schedule`,{method:'POST',body}); toast('ذخیره شد ✅'); backFn();
    },
    onBack: backFn, noAutofocus:true,
  });
}

function showInviteCode(code){
  hT.textContent='🎫 کد دعوت ادمین'; hS.textContent='این کد فقط یک‌بار قابل استفاده‌ست';
  main.innerHTML=''; clearFoot();
  const cmd='/claimadmin '+code;
  main.appendChild(el('<div class="sub" style="margin-bottom:8px">این دستور رو برای فرد مورد نظر بفرستید تا توی چت ربات بزنه:</div>'));
  const box=el('<div class="link-box" style="font-size:16px;text-align:center;direction:ltr"></div>'); box.textContent=cmd; main.appendChild(box);
  foot.appendChild(btn('کپی دستور',()=>{ try{ navigator.clipboard.writeText(cmd); toast('کپی شد ✅'); }catch(e){ toast(cmd); } }));
  foot.appendChild(btn('بازگشت',()=>{ aScreen='admins'; renderAdmin(); },'ghost'));
}

// ================= کسب‌وکارهای من + مسیریابی ورود =================
function showMyBusinesses(list){
  hT.textContent='کسب‌وکارهای من'; hS.textContent='یکی رو برای مدیریت انتخاب کنید';
  main.innerHTML=''; clearFoot();
  list.forEach(b=>main.appendChild(iconCard('briefcase','blue',b.name, b.category||'', ()=>startAdmin(b.id))));
  foot.appendChild(btn('ساخت کسب‌وکار جدید',()=>showCategoryPicker(()=>showMyBusinesses(list))));
}

// ورود از دکمه‌ی Open (بدون لینک خاص):
// ۱) اگه کسب‌وکار داره → پنل مدیریت  ۲) وگرنه اگه با لینک کسب‌وکاری اومده بود → صفحه‌ی همون کسب‌وکار  ۳) وگرنه صفحه‌ی ساخت کسب‌وکار
async function goHome(){
  let me=null;
  try{ me = await api('/api/me'); }
  catch(e){
    // اگه سرور هنوز نسخه‌ی قدیمی بود (بدون /api/me)، از مسیر قدیمی‌تر کسب‌وکارهای کاربر رو می‌گیریم
    try{ const list = await api('/api/my-businesses'); me = {businesses:list, last_business:null}; }
    catch(e2){ me=null; }
  }
  if(me){
    if(me.businesses.length===1) return startAdmin(me.businesses[0].id);
    if(me.businesses.length>1) return showMyBusinesses(me.businesses);
    if(me.last_business) return startCustomer(me.last_business.slug);
  }
  renderLanding();
}

// ================= شروع =================
(async function init(){
  if(!initData){ showError('این صفحه فقط باید از داخل تلگرام (دکمه داخل ربات) باز بشه.'); return; }
  if(isAdminMode && qsBiz){ startAdmin(parseInt(qsBiz)); }
  else if(qsBiz){ startCustomer(qsBiz); }
  else { goHome(); }
})();
</script>
